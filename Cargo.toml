[package]
name = "mot-core"
version = "0.4.0"
edition = "2024"
autobins = false

[lib]
path = "src/core.rs"
crate-type = ["rlib"]

[workspace]
members = [
    "plugins/mot-generator",
    "plugins/mot-trainer",
    "plugins/mot-player",
    "plugins/mot-tuner",
]
resolver = "2"

[features]
default = []
training = ["dep:candle-core", "dep:candle-nn", "dep:candle-metal-kernels"]
# Flags any allocation your DSP makes on the audio thread in `process`.
# Dev/test only: `cargo test --features rt-paranoid`. Off, zero-cost by
# default.
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { version = "6.3" }
crossbeam-queue = "0.3"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Metal is used exclusively by the offline A2 trainer. The live A2 runtime
# remains the fixed native ARM64 CPU implementation in `src/a2.rs`.
candle-core = { version = "0.11", features = ["metal"], optional = true }
candle-nn = { version = "0.11", features = ["metal"], optional = true }
candle-metal-kernels = { version = "0.11", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Custom profile for `cargo truce install --shell`. The shell-mode
# build (`cargo build --profile shell --features ...,shell`) lands the
# shell binary at `target/shell/lib<crate>.dylib`, independent of
# `target/release/` (where regular `cargo build --release` writes) and
# `target/debug/` (where `cargo build` writes). Inherits release for
# DSP perf parity.
[profile.shell]
inherits = "release"
