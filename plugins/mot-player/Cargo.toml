[package]
name = "mot-player"
version = "0.6.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["vst3"]
vst3 = ["dep:truce-vst3"]
shell = ["truce/shell"]
rt-paranoid = ["truce/rt-paranoid", "mot-core/rt-paranoid"]

[dependencies]
mot-core = { path = "../.." }
mot-ui = { path = "../mot-ui" }
truce = { version = "6.3" }
truce-egui = { version = "6.3" }
truce-vst3 = { version = "6.3", optional = true }
egui = "0.34"
crossbeam-queue = "0.3"
pollster = "0.4"
rfd = { version = "0.15", default-features = false }
